# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — RedFort Tech platform
#
# Deploys three services from this monorepo:
#   redforttech-api   NestJS API          (apps/api)
#   redforttech-web   public website      (apps/web)
#   redforttech-cms   admin panel         (apps/cms)
#
# The database is not defined here: it stays on Neon. Render's free Postgres is
# deleted 30 days after creation, which rules it out for anything a client sees.
#
# Setup and first-deploy steps: docs/DEPLOYMENT.md
#
# ── Public URLs ──────────────────────────────────────────────────────────────
# Render names a service's URL after the service: https://<name>.onrender.com.
# Render appended the "-x56l" suffix because the plain names were taken. If the
# services are ever recreated under different names, update every line marked
#   "URL" below: ALLOWED_ORIGINS, SITE_URL, the sitemap rewrite, and each
#   frontend's buildCommand.
# The frontends cannot look the API up automatically: Render's `fromService`
# resolves to a private-network hostname that browsers cannot reach.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: redforttech-api
    runtime: node
    # The Neon database is in AWS us-east-2 (Ohio); co-locating halves latency.
    # Region cannot be changed after the service is created.
    region: ohio
    plan: free
    rootDir: apps/api

    # --include=dev: the build needs the Nest CLI and Prisma CLI, which are
    # devDependencies. NODE_ENV=production below would otherwise make npm skip
    # them and the build would fail with "nest: not found".
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build

    # Migrations run on start because preDeployCommand is not available on the
    # free plan. `migrate deploy` only applies pending migrations, so running it
    # on every start is safe. On a paid plan, move it to preDeployCommand.
    startCommand: npx prisma migrate deploy && node dist/main

    # Liveness only — it does not touch the database, so a slow database wake
    # does not fail the health check and restart the service.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production
      # Render terminates TLS at a load balancer. Trusting one hop makes the
      # rate limiter see each visitor's real IP instead of the proxy's, which
      # would otherwise put every user in the same login-attempt bucket.
      - key: TRUST_PROXY
        value: "1"
      # Generated by Render: a random 256-bit value, never committed, and
      # independent of the one that was shared during development.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # URL — both frontend origins.
      - key: ALLOWED_ORIGINS
        value: https://redforttech-web-x56l.onrender.com,https://redforttech-cms-x56l.onrender.com
      # URL — the website's origin, used for absolute links in sitemap.xml.
      - key: SITE_URL
        value: https://redforttech-web-x56l.onrender.com

      # Secrets: entered in the Render dashboard when the Blueprint is created.
      # See docs/DEPLOYMENT.md for the exact DATABASE_URL format.
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Website ────────────────────────────────────────────────────────────────
  - type: web
    name: redforttech-web
    runtime: static
    rootDir: apps/web
    # URL — Vite inlines VITE_API_URL at build time, so it is set here rather
    # than as a runtime variable. It is a public URL, not a secret.
    buildCommand: >-
      npm ci --include=dev &&
      VITE_API_URL=https://redforttech-api-x56l.onrender.com/api/v1/public npm run build
    staticPublishPath: dist
    routes:
      # Crawlers only look for the sitemap at the site root. It is generated
      # from published content by the API, so this forwards the request there.
      # Listed before the catch-all below so it is not served index.html.
      - type: rewrite
        source: /sitemap.xml
        destination: https://redforttech-api-x56l.onrender.com/api/v1/public/sitemap.xml
      # Client-side routing: every non-file path serves the app shell. Render
      # serves real files (JS bundles, robots.txt, images) before applying this.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints asset filenames, so they are safe to cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # ── CMS ────────────────────────────────────────────────────────────────────
  - type: web
    name: redforttech-cms
    runtime: static
    rootDir: apps/cms
    # URL — the admin panel calls the full API, including /admin routes.
    buildCommand: >-
      npm ci --include=dev &&
      VITE_API_URL=https://redforttech-api-x56l.onrender.com/api/v1 npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The admin panel must never appear in search results.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      # Nothing should embed the admin panel in a frame (clickjacking).
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
